<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ff6f91" id="theme-color" />
    <meta name="description" content="A cheerful, no-pressure step goal tracker." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Steppy" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon-64.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
    <title>Steppy</title>
  </head>
  <body>
    <div class="ambient" id="ambient" aria-hidden="true"></div>
    <main class="app">
      <header class="top">
        <img class="logo-icon" id="logo-icon" src="icons/icon-192.png" alt="" width="54" height="54" />
        <div class="brand">
          <p class="greeting" id="greeting">Hello!</p>
          <div class="title-row">
            <h1>Steppy</h1>
            <span class="version" id="app-version"></span>
          </div>
        </div>
        <button class="icon-btn settings-btn" id="settings-btn" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </header>

      <section id="today" class="card today-card" aria-live="polite"></section>
      <section id="catchup"></section>
      <section id="stats" class="stats"></section>
      <section id="machine-card"></section>
      <section id="suggestion"></section>
      <section id="backup"></section>

      <section class="card calendar-card">
        <div class="cal-head">
          <button class="icon-btn small" id="prev-month" aria-label="Previous month">‹</button>
          <h2 id="month-label"></h2>
          <button class="icon-btn small" id="next-month" aria-label="Next month">›</button>
        </div>
        <div class="weekdays" aria-hidden="true">
          <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
        <p class="month-summary" id="month-summary"></p>
        <div class="legend">
          <span><i class="dot regular"></i>Goal</span>
          <span><i class="dot big"></i>Big goal</span>
          <span><i class="dot skip"></i>Skip day</span>
          <span><i class="dot missed"></i>Rest</span>
        </div>
      </section>

      <section id="goals" class="card goals-card"></section>

      <p class="sync-status" id="sync-status"></p>
      <p class="footer-note">Tap any past day on the calendar to log or change it. 💕</p>
    </main>

    <div id="backdrop" class="backdrop" hidden></div>
    <div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></div>
    <div id="modal" class="modal" role="dialog" aria-modal="true" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <canvas id="fx" class="fx" aria-hidden="true"></canvas>

    <script type="module" src="app.js"></script>
  </body>
</html>
